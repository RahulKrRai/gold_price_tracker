# Collect gold rates and retailer prices on GitHub's servers, then publish the read-only dashboard
# to GitHub Pages. No computer of yours needs to be on, and no long-lived key is stored anywhere.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# Optional secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID           Telegram deal alerts
#   AMAZON_CLIENT_ID, AMAZON_CLIENT_SECRET, AMAZON_PARTNER_TAG, AMAZON_CREDENTIAL_VERSION
# Optional variables: MY_OFFERS (default sbi-card,cb-1350-29k), ALERT_BELOW_PER_FINE_G, RETAILERS
#
# Security:
#   * Every third-party action is pinned to a full commit SHA (tag in the comment).
#   * The default token is read-only; only the deploy job can write to Pages, and it never sees secrets.
#   * Secrets are passed only to the collect step, and scheduled/manual runs only (never pull requests).
#   * Price history (SQLite) is carried between runs in the Actions cache, not committed to the repo.
name: collect-and-publish

on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours (UTC); GitHub may start scheduled runs a few minutes late
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      GOLD_DB_PATH: data/gold.db
      PUBLISH_DIR: site
      GOLD_DIAG_DIR: diag   # screenshots of pages that returned no products
      MY_OFFERS: ${{ vars.MY_OFFERS || 'sbi-card,cb-1350-29k' }}
      RETAILERS: ${{ vars.RETAILERS || 'myntra,ajio,flipkart,amazon' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Restore price history
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/gold.db
          key: gold-db-${{ github.run_id }}
          restore-keys: gold-db-

      - name: Collect rates and prices, build site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_BELOW_PER_FINE_G: ${{ vars.ALERT_BELOW_PER_FINE_G }}
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION }}
        run: python -m goldtracker run-once --report run-report.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy of the database and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gold-db-${{ github.run_id }}
          path: |
            data/gold.db
            run-report.json
            diag/
          retention-days: 14

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
